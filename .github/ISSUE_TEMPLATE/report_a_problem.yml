name: Report a problem
description: A broken link, an install command that no longer works, or a mistake on the page
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Which skill or section
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: Paste the command you ran and the error text if there was one.
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What it should say instead, if you know
    validations:
      required: false
  - type: dropdown
    id: tool
    attributes:
      label: Which tool were you using
      options:
        - Claude Code
        - Codex
        - Something else
        - Does not apply
    validations:
      required: true
